<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Quiz Niemiecki</title>

<style>
body{
font-family:Arial;
background:#f4f4f4;
padding:40px;
}

table{
border-collapse:collapse;
width:700px;
margin:auto;
background:white;
}

td,th{
border:1px solid #ccc;
padding:10px;
}

input{
width:95%;
padding:6px;
}

.correct{
background:#b9f6ca;
}

.wrong{
background:#ffb3b3;
}

button{
display:block;
margin:20px auto;
padding:10px 20px;
font-size:16px;
cursor:pointer;
}

#score{
text-align:center;
font-size:20px;
margin-top:20px;
}
</style>
</head>

<body>

<h2 style="text-align:center">🇩🇪 Wpisz tłumaczenia po niemiecku</h2>

<table id="quiz">
<tr>
<th>Polski</th>
<th>Niemiecki</th>
</tr>
</table>

<button onclick="check()">Sprawdź wszystko</button>

<div id="score"></div>

<script>

const vocab=[
["odrzucenie","die Ablehnung"],
["akceptować","akzeptieren"],
["strach","die Angst"],
["samotność","die Einsamkeit"],
["nastawienie","die Einstellung"],
["przeżywać","erleben"],
["rozumieć coś źle","etwas falsch verstehen"],
["czuć","fühlen"],
["uczucie","das Gefühl"],
["wyrażać uczucia","Gefühle ausdrücken"],
["okazywać uczucia","Gefühle zeigen"],
["znać","kennen"],
["rozwiązanie","die Lösung"],
["otwarcie rozmawiać","offen sprechen"],
["milczeć","schweigen"],
["troszczyć się o","sich kümmern um"],
["obciążenie","die Belastung"],
["obniżyć stres","den Stress abbauen"],
["presja","der Druck"],
["mieć spocone dłonie","feuchte Hände bekommen"],
["mówić całkiem cicho","ganz leise sprechen"],
["ugięły się kolana","weiche Knie bekommen"],
["serce skacze do gardła","das Herz schlägt bis zum Halse"],
["robi się ciemno przed oczami","schwarz vor den Augen wird"],
["czerwienić się","rot im Gesicht werden"],
["szkodzić","schaden"],
["szkodliwy","schädlich"],
["pocić się","schwitzen"],
["czuć się zestresowanym","sich gestresst fühlen"],
["być stresującym","stressig sein"],
["być w stresie","unter Stress stehen"]
];

const table=document.getElementById("quiz");

vocab.forEach((v,i)=>{
let row=document.createElement("tr");

row.innerHTML=
"<td>"+v[0]+"</td>"+
"<td><input id='q"+i+"'></td>";

table.appendChild(row);
});

function check(){

let score=0;

vocab.forEach((v,i)=>{

let input=document.getElementById("q"+i);
let val=input.value.toLowerCase().trim();
let correct=v[1].toLowerCase();

if(val===correct){
input.className="correct";
score++;
}
else{
input.className="wrong";
input.value=input.value+"  → "+v[1];
}

});

document.getElementById("score").innerText=
"Wynik: "+score+" / "+vocab.length;

}

</script>

</body>
</html>
